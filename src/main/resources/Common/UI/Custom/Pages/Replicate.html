<div style="anchor-width: 400; anchor-height: 500; anchor-right: 1; anchor-top: 20; background-color: #2a2a3e; layout-mode: top;">
        <div>
            <p><span data-hyui-bold="true">{{$playerName}} whats going on&nbsp; </span><span> Hey there &nbsp;</span></p>
        </div>
        <code-editor id="code-editor-example"
                     style="anchor-width: 200; anchor-height: 300;"
                     value="Hello: {}"
                     placeholder="Type code here..."
                     maxlength="2000"
                     rows="8"
                     data-hyui-max-visible-lines="8"
                     data-hyui-max-lines="50"
                     data-hyui-auto-grow="false"
                     data-hyui-auto-focus="true"
                     data-hyui-auto-select-all="true"
                     data-hyui-line-number-width="32"
                     data-hyui-line-number-padding="6"
                     data-hyui-line-number-text-color="#99a1b3"
                     data-hyui-line-number-background="Common.ui InputBoxBackground"
                     data-hyui-scrollbar-style="Common.ui DefaultScrollbarStyle"
                     data-hyui-placeholder-style="Common.ui DefaultInputFieldPlaceholderStyle"
                     data-hyui-content-padding="(Horizontal:10, Vertical:8)">
        </code-editor>
        <hyvatar username="{{$playerName}}" size='64'></hyvatar>
        <div style="layout-mode: left;">
            <div style="anchor-left: 1; anchor-width: 100; layout-mode: top;">
                <p>Lobby:</p>
                <p>Jogadores:</p>
                <p>Vitórias:</p>
                <p>Kills:</p>
            </div>
            <div style="anchor-right: 1; anchor-width: 100; layout-mode: top;">
                <p>Some Lobby</p>
                <p>123</p>
                <p>4565</p>
                <p>25</p>
            </div>
        </div>
    </div>
